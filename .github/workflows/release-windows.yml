# 打包并发布 Windows 免安装版（制卡端 + 扫描端）。
#
# 触发：
#   * 推 v* 标签        —— 构建两个 zip 并挂到对应的 GitHub Release 上
#   * 手动 workflow_dispatch —— 只构建、只上传 Artifact，不发 Release（拿来验证）
#
# 为什么单独一个工作流、而不是塞进 docker.yml：Windows runner 比 Linux 贵、
# 构建也慢得多（要装 onnxruntime 才能打包手写 CNN），跟着 main 的每次 push 跑不划算。
name: Release (Windows)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（仅用于命名产物，例如 v1.0.3）'
        required: false
        default: ''

permissions:
  contents: write        # 需要写权限才能往 Release 挂资产

env:
  # 与 scanner/Dockerfile 的基础镜像保持一致 —— 本项目的钉死版本
  # （numpy 1.26.4 / opencv-headless 4.9.0.80 / onnxruntime 1.30.0）在 3.12 上都有轮子，
  # 在 3.13 上 numpy 1.26 没有 cp313 轮子，会退化成本地编译然后失败。
  PYTHON_VERSION: '3.12'

jobs:
  windows:
    name: Windows 免安装版（制卡端 + 扫描端）
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: scanner/requirements.txt

      - name: Install scanner deps + PyInstaller
        run: |
          python -m pip install --upgrade pip
          # onnxruntime 已在 requirements.txt 里，CI 一并装好 —— 手写 CNN 走 ONNX Runtime，
          # 不再需要 290MB 的 libtorch。
          python -m pip install -r scanner/requirements.txt pyinstaller

      - name: Verify onnxruntime is importable
        run: |
          python -c "import onnxruntime; print('onnxruntime', onnxruntime.__version__)"

      - name: Build portable packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $v = ''
          if ($env:GITHUB_REF -like 'refs/tags/*') { $v = $env:GITHUB_REF_NAME }
          if (-not $v) { $v = '${{ inputs.version }}' }
          if (-not $v) { $v = 'dev' }
          Write-Host "产物版本号：$v"
          ./packaging/windows/build.ps1 -Version $v

      - name: Smoke test (启动两个 exe，确认能起来)
        shell: pwsh
        run: ./packaging/windows/ci_smoke.ps1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: |
            packaging/windows/dist/release/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Attach zips to GitHub Release
        # 只在标签触发时发 Release；workflow_dispatch 只留 Artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/windows/dist/release/*.zip
          fail_on_unmatched_files: true
